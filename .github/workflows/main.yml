name: LANGIT v60 Forecast OS

on:
  workflow_dispatch:
  schedule:
    # WIB: 07:00, 11:00, 15:00, 18:00
    # UTC: 00:00, 04:00, 08:00, 11:00
    - cron: "0 0,4,8,11 * * *"

permissions:
  contents: write

concurrency:
  group: langit-v60-forecast
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-22.04
    timeout-minutes: 18

    steps:
      - name: Checkout main generator
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime helpers
        run: |
          python -m pip install --upgrade pip
          python -m pip install certifi

      - name: Resolve workflow inputs
        run: |
          echo "=== Repository files ==="
          ls -la
          echo "=== Python version ==="
          python --version
          echo "=== Current branch ==="
          git branch --show-current

      - name: Syntax check main script
        run: |
          python -m py_compile weather_ensemble_multi_location.py

      - name: Dry-run source URLs
        run: |
          python weather_ensemble_multi_location.py \
            --mode dry-run \
            --locations all \
            --timezone Asia/Jakarta \
            --public-base-url https://marcooo20-d.github.io/weather-forecast \
            --no-debug \
            --no-save-raw-payloads

      - name: Run LANGIT v60 forecast
        timeout-minutes: 10
        run: |
          python weather_ensemble_multi_location.py \
            --mode forecast \
            --locations all \
            --timezone Asia/Jakarta \
            --public-base-url https://marcooo20-d.github.io/weather-forecast \
            --no-debug \
            --no-save-raw-payloads

      - name: Regenerate public verification pages
        run: |
          python weather_ensemble_multi_location.py \
            --mode public-index \
            --locations all \
            --timezone Asia/Jakarta \
            --public-base-url https://marcooo20-d.github.io/weather-forecast \
            --no-debug \
            --no-save-raw-payloads

      - name: Harden public output before deploy
        run: |
          find outputs -name "*.sqlite" -delete || true
          find outputs -name "*.db" -delete || true
          find outputs -type d -name "logs" -prune -exec rm -rf {} + || true
          find outputs -type d -name "raw_payloads" -prune -exec rm -rf {} + || true
          find outputs -type d -name "__pycache__" -prune -exec rm -rf {} + || true

      - name: Validate public files
        run: |
          test -f outputs/index.html
          test -f outputs/langit_portal_map.html
          test -f outputs/dago/anemos_app.html
          test -f outputs/dago/anemos_3day.html
          test -f outputs/dago/anemos_activity.html
          test -f outputs/dago/langit_map_room.html

          echo "=== Public output files ==="
          find outputs -maxdepth 3 -type f | sort | head -160

      - name: Upload generated site artifact
        uses: actions/upload-artifact@v4
        with:
          name: langit-v60-public-site
          path: outputs
          retention-days: 7

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: outputs
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false
