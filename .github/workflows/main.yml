name: LANGIT v62 Forecast OS

on:
  workflow_dispatch:
  schedule:
    # 18:00 WIB = 11:00 UTC
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: langit-v62-forecast
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime helpers
        run: |
          python -m pip install --upgrade pip certifi

      - name: Inspect repository
        run: |
          pwd
          ls -la
          test -f weather_ensemble_multi_location.py
          test -f langit_v62_visual_rebuild.py

      - name: Syntax check scripts
        run: |
          python -m py_compile weather_ensemble_multi_location.py
          python -m py_compile langit_v62_visual_rebuild.py

      - name: LANGIT generator doctor
        run: |
          python weather_ensemble_multi_location.py \
            --mode doctor \
            --locations all \
            --timezone Asia/Jakarta \
            --no-debug \
            --no-save-raw-payloads

      - name: Run forecast engine
        timeout-minutes: 16
        run: |
          python weather_ensemble_multi_location.py \
            --mode forecast \
            --locations all \
            --timezone Asia/Jakarta \
            --public-base-url https://marcooo20-d.github.io/weather-forecast \
            --http-timeout 6 \
            --max-retry-http 1 \
            --max-workers 3 \
            --max-inflight-per-host 1 \
            --target-step-minutes 180 \
            --no-debug \
            --no-save-raw-payloads

      - name: Generate original public index
        run: |
          python weather_ensemble_multi_location.py \
            --mode public-index \
            --locations all \
            --timezone Asia/Jakarta \
            --public-base-url https://marcooo20-d.github.io/weather-forecast \
            --no-debug \
            --no-save-raw-payloads

      - name: Rebuild LANGIT v62 visual public layer
        run: |
          python langit_v62_visual_rebuild.py \
            --root outputs \
            --public-base-url https://marcooo20-d.github.io/weather-forecast

      - name: Verify public output
        run: |
          test -f outputs/index.html
          test -f outputs/langit_portal_map.html
          test -f outputs/dago/anemos_app.html
          test -f outputs/dago/anemos_3day.html
          test -f outputs/dago/anemos_activity.html
          test -f outputs/dago/langit_map_room.html
          test -f outputs/dago/langit_model_court.html
          test -f outputs/dago/sentinel_x_accuracy_public.html
          python langit_v62_visual_rebuild.py --root outputs --verify-only
          if grep -R "\[\.new Set\|const hours=\[\.new Set\|ANEMOS sedang\|AETHER Sentinel" outputs/*.html outputs/*/*.html 2>/dev/null; then
            echo "Public output still contains broken JS or old visible branding."
            exit 1
          fi

      - name: Harden public output
        run: |
          find outputs -name "*.sqlite" -delete || true
          find outputs -name "*.db" -delete || true
          find outputs -type d -name "logs" -prune -exec rm -rf {} + || true
          find outputs -type d -name "raw_payloads" -prune -exec rm -rf {} + || true
          find outputs -type f -name "*.py" -delete || true
          find outputs -type f -name "*.pyc" -delete || true
          find outputs -maxdepth 3 -type f | sort | sed -n '1,180p'

      - name: Upload generated site artifact
        uses: actions/upload-artifact@v4
        with:
          name: langit-v62-public-site
          path: outputs
          retention-days: 7

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: outputs
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: LANGIT v62 visual public layer"
