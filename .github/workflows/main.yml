name: Daily Forecast

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-22.04
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AETHER Sentinel X forecast
        timeout-minutes: 8
        run: |
          python weather_ensemble_multi_location.py \
            --mode forecast \
            --locations all \
            --timezone Asia/Jakarta \
            --public-base-url https://marcooo20-d.github.io/weather-forecast \
            --no-debug \
            --no-save-raw-payloads

      - name: Generate public index
        run: |
          python weather_ensemble_multi_location.py \
            --mode public-index \
            --locations all \
            --timezone Asia/Jakarta \
            --public-base-url https://marcooo20-d.github.io/weather-forecast \
            --no-debug \
            --no-save-raw-payloads

      - name: Clean internal files before deploy
        run: |
          find outputs -name "*.sqlite" -delete || true
          find outputs -name "*.db" -delete || true
          find outputs -type d -name "logs" -prune -exec rm -rf {} + || true
          find outputs -type d -name "raw_payloads" -prune -exec rm -rf {} + || true

      - name: Debug public files
        run: |
          echo "=== TOP OUTPUT FILES ==="
          find outputs -maxdepth 2 -type f | sort | head -120

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: outputs
