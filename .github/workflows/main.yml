name: LANGIT Forecast and Pages

on:
  push:
    branches: [main]
    paths:
      - 'weather_ensemble_multi_location.py'
      - 'site_tools/weather_field.py'
      - 'site_tools/workflow_inputs.py'
      - 'forecast_tools/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      locations:
        description: "Lokasi yang dijalankan: all / dago / jatinangor / arjawinangun / comma-separated"
        required: false
        default: "all"
      debug:
        description: "Aktifkan debug log"
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"
  schedule:
    - cron: "0 0,2,4,6,8,10,12 * * *"

permissions:
  contents: read

concurrency:
  group: langit-production
  cancel-in-progress: false

jobs:
  forecast:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write

    env:
      TZ: Asia/Jakarta
      PUBLIC_BASE_URL: https://marcooo20-d.github.io/weather-forecast
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout main generator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install runtime helpers
        run: |
          python -m pip install -r requirements.txt

      - name: Resolve workflow inputs
        env:
          LOCATIONS_INPUT: ${{ github.event.inputs.locations }}
          DEBUG_INPUT: ${{ github.event.inputs.debug }}
        run: python -m site_tools.workflow_inputs

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Inspect repository
        run: |
          pwd
          ls -la
          test -f weather_ensemble_multi_location.py
          test -f build_weather_site.py

      - name: Syntax check scripts
        run: |
          python -m py_compile weather_ensemble_multi_location.py
          python -m py_compile build_weather_site.py

      - name: LANGIT generator doctor
        run: |
          python weather_ensemble_multi_location.py \
            --mode doctor \
            --locations "$LOCATIONS" \
            --timezone Asia/Jakarta \
            $DEBUG_FLAG \
            --no-save-raw-payloads

      - name: Collect independent observations and rainfall references
        shell: bash
        timeout-minutes: 12
        run: |
          python weather_ensemble_multi_location.py \
            --mode sync-observations \
            --locations "$LOCATIONS" \
            --timezone Asia/Jakarta \
            --lookback-days 14 \
            --http-timeout 12 \
            --no-save-raw-payloads

      - name: Run forecast engine
        id: forecast
        shell: bash
        timeout-minutes: 25
        run: |
          set +e
          python weather_ensemble_multi_location.py \
            --mode forecast \
            --locations "$LOCATIONS" \
            --timezone Asia/Jakarta \
            --public-base-url "$PUBLIC_BASE_URL" \
            --http-timeout 8 \
            --max-retry-http 1 \
            --max-workers 3 \
            --max-inflight-per-host 1 \
            --target-step-minutes 180 \
            $DEBUG_FLAG \
            --no-save-raw-payloads
          RC=$?
          echo "forecast_exit_code=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" = "0" ]; then
            echo "Forecast selesai normal."
          elif [ "$RC" = "2" ]; then
            echo "::warning::Forecast selesai dengan warning, public layer tetap dibangun."
          else
            echo "::error::Forecast gagal dengan exit code $RC."
            exit "$RC"
          fi

      - name: Evaluate performance (backtesting)
        shell: bash
        run: |
          python weather_ensemble_multi_location.py \
            --mode evaluate \
            --locations "$LOCATIONS" \
            --timezone Asia/Jakarta \
            $DEBUG_FLAG \
            --no-save-raw-payloads

      - name: Verify archived rainfall against satellite reference
        run: python -m forecast_tools.verification --root outputs --locations "$LOCATIONS"

      - name: Update regional map and headlines
        run: |
          python -m site_tools.weather_field --root outputs
          python -m site_tools.weather_news --root outputs

      - name: Rebuild LANGIT public product layer
        run: |
          LANGIT_SOURCE_SHA="$(git rev-parse HEAD)" python build_weather_site.py \
            --root outputs \
            --public-base-url "$PUBLIC_BASE_URL"

      - name: Verify public output
        run: |
          python build_weather_site.py --root outputs --verify-only
          test -f outputs/index.html
          test -f outputs/langit_portal_map.html

      - name: Build and validate bounded public site
        run: python -m site_tools.public_site --source outputs --destination _site

      - name: Commit and push changes back to main
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # Stage all outputs/ changes
          git add outputs/
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update weather forecast history, observations, and accuracy metrics [skip ci]"
            # A concurrent main update must reject this push before publication.
            git push origin HEAD:main
          fi

      - name: Upload generated site artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: langit-public-site
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: validated LANGIT public site"


