name: LANGIT v60 Forecast OS

on:
  workflow_dispatch:
  schedule:
    # 07:00, 11:00, 15:00, 18:00 WIB
    # 00:00, 04:00, 08:00, 11:00 UTC
    - cron: "0 0,4,8,11 * * *"

permissions:
  contents: write

concurrency:
  group: langit-v60-forecast
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout main generator
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime helpers
        run: |
          python -m pip install --upgrade pip
          python -m pip install certifi

      - name: Inspect repository
        run: |
          echo "=== Repository root ==="
          pwd
          ls -la
          echo "=== Python ==="
          python --version
          echo "=== Workflow branch ==="
          git branch --show-current

      - name: Syntax check main script
        run: |
          python -m py_compile weather_ensemble_multi_location.py

      - name: LANGIT generator doctor
        run: |
          python weather_ensemble_multi_location.py \
            --mode doctor \
            --locations all \
            --timezone Asia/Jakarta \
            --public-base-url https://marcooo20-d.github.io/weather-forecast \
            --no-debug \
            --no-save-raw-payloads

      - name: Run LANGIT v60 forecast
        timeout-minutes: 12
        run: |
          python weather_ensemble_multi_location.py \
            --mode forecast \
            --locations all \
            --timezone Asia/Jakarta \
            --public-base-url https://marcooo20-d.github.io/weather-forecast \
            --no-debug \
            --no-save-raw-payloads

      - name: Generate LANGIT public portal
        run: |
          python weather_ensemble_multi_location.py \
            --mode public-index \
            --locations all \
            --timezone Asia/Jakarta \
            --public-base-url https://marcooo20-d.github.io/weather-forecast \
            --no-debug \
            --no-save-raw-payloads

      - name: Verify public output
        run: |
          python weather_ensemble_multi_location.py \
            --mode verify-public \
            --locations all \
            --timezone Asia/Jakarta \
            --public-base-url https://marcooo20-d.github.io/weather-forecast \
            --no-debug \
            --no-save-raw-payloads

      - name: Harden public output before deploy
        run: |
          find outputs -name "*.sqlite" -delete || true
          find outputs -name "*.db" -delete || true
          find outputs -name "*.log" -delete || true
          find outputs -type d -name "logs" -prune -exec rm -rf {} + || true
          find outputs -type d -name "raw_payloads" -prune -exec rm -rf {} + || true
          find outputs -type d -name "__pycache__" -prune -exec rm -rf {} + || true

      - name: Validate essential public files
        run: |
          test -d outputs
          test -f outputs/index.html

          echo "=== Generated public files ==="
          find outputs -maxdepth 3 -type f | sort | head -200

      - name: Upload generated site artifact
        uses: actions/upload-artifact@v4
        with:
          name: langit-v60-public-site
          path: outputs
          retention-days: 7

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: outputs
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false
