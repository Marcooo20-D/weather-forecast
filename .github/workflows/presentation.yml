name: Publish interface

on:
  push:
    branches: [main]
    paths:
      - 'build_weather_site.py'
      - 'site_tools/campus_*'
      - 'site_tools/campus_assets/**'
      - 'site_tools/editorial.css'
      - 'site_tools/forecast_map.js'
      - 'site_tools/weather_field.js'
      - 'site_tools/weather_news.py'
      - 'site_tools/public_data.js'
      - 'site_tools/public_site.py'
      - '.github/workflows/presentation.yml'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: langit-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /site_tools/
            /tests/
            /.github/
            /outputs/dim_locations.csv
            /outputs/dim_sources.csv
            /outputs/ensemble_all_locations.csv
            /outputs/ensemble_fact_all_locations.csv
            /outputs/ensemble_long_all_locations.csv
            /outputs/forecast_all_locations.csv
            /outputs/source_status_all_locations.csv
            /outputs/weather_field_v1.json
            /outputs/weather_news.json
            /outputs/*/langit_api_v1.json
            /outputs/*/forecast.csv
            /outputs/*/ensemble.csv
            /outputs/*/bmkg.csv
            /outputs/*/source_status.csv
            /outputs/*/sentinel_x_verification_summary.json
            /outputs/*/sentinel_x_reliability.csv
            /outputs/*/probabilistic_verification.json
            /outputs/*/activity_verification.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check source and data contracts
        run: python -m unittest discover -s tests -q
      - name: Build interface from the latest saved forecasts
        run: |
          LANGIT_SOURCE_SHA="$(git rev-parse HEAD)" python build_weather_site.py --root outputs
          python build_weather_site.py --root outputs --verify-only
          python -m site_tools.public_site --source outputs --destination _site
      - name: Upload public site
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: langit-public-interface
          path: _site
          include-hidden-files: true
          retention-days: 3
      - name: Publish validated interface
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publish validated LANGIT interface'
